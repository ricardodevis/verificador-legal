name: Tests offline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt

      - name: Lint Python syntax
        run: |
          cd src
          python -m compileall -q despliegue lib pruebas skill/verificador-jurisprudencia-es/scripts verificar.py

      - name: Run unit tests
        run: |
          cd src
          pytest pruebas/test_unitarios.py pruebas/test_comportamiento.py -v

      - name: Validate plugin.json files
        run: |
          cd src
          python -c "
          import json
          from pathlib import Path
          for p in Path('cowork-plugin').rglob('plugin.json'):
              data = json.loads(p.read_text())
              assert 'name' in data and 'version' in data, f'{p} faltan campos'
              assert data.get('license') == 'Apache-2.0', f'{p} licencia no es Apache-2.0'
              print(f'OK {p}')
          "
